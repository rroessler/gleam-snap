name: gleam
adopt-info: gleam
summary: Gleam Programming Language
description: |
    Gleam is a friendly language for building type-safe systems that
    scale! For more information see [the website](https://gleam.run)

title: Gleam
license: Apache-2.0
contact: rroesslerio@gmail.com
website: https://gleam.run
source-code:
    - https://github.com/gleam-lang/gleam
    - https://github.com/rroessler/gleam-snap
issues:
    - https://github.com/gleam-lang/gleam/issues
    - https://github.com/rroessler/gleam-snap/issues

base: core26
grade: stable
confinement: classic

platforms:
    amd64:
    arm64:

apps:
    gleam:
        command: bin/gleam
        environment:
            LANG: C.UTF-8
            LANGUAGE: C.UTF-8
            LC_ALL: C.UTF-8

parts:
    gleam:
        plugin: nil
        source-type: tar
        source-checksum:
            - on amd64: sha256/dd4685bac116e8183946a7b5604d35da32f482fae6ab567abefa073a41294c9c
            - on arm64: sha256/708c921dabaf6488efd6852dddba2c027630dca1ff13d6d0739b29ab5e4cc977
        source:
            - on amd64: https://github.com/gleam-lang/gleam/releases/download/v1.19.0-rc2/gleam-v1.19.0-rc2-x86_64-unknown-linux-musl.tar.gz
            - on arm64: https://github.com/gleam-lang/gleam/releases/download/v1.19.0-rc2/gleam-v1.19.0-rc2-aarch64-unknown-linux-musl.tar.gz
        override-build: |
            version=$($SNAPCRAFT_PART_SRC/gleam -V | awk '/gleam/{print $2}')

            craftctl set version=$version
            craftctl default

            mkdir -p $SNAPCRAFT_PART_INSTALL/bin
            mv $SNAPCRAFT_PART_BUILD/gleam $SNAPCRAFT_PART_INSTALL/bin/gleam
