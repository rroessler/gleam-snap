name: gleam
adopt-info: gleam
summary: Gleam Programming Language
description: |
    Gleam is a friendly language for building type-safe systems that
    scale! For more information see [the website](https://gleam.run)

title: Gleam
license: Apache-2.0
contact: rroesslerio@gmail.com
website: https://gleam.run
source-code:
    - https://github.com/gleam-lang/gleam
    - https://github.com/rroessler/gleam-snap
issues:
    - https://github.com/gleam-lang/gleam/issues
    - https://github.com/rroessler/gleam-snap/issues

base: core26
grade: stable
confinement: classic

platforms:
    amd64:
    arm64:

apps:
    gleam:
        command: bin/gleam
        environment:
            LANG: C.UTF-8
            LANGUAGE: C.UTF-8
            LC_ALL: C.UTF-8

parts:
    gleam:
        plugin: nil
        source-type: tar
        source-checksum:
            - on amd64: sha256/221bff0758372aae76cfe440b7445f9f5c7ea67947297b1112115c798fd18385
            - on arm64: sha256/b0eeed8c625471c2ab0fab7058b53979c47fa3bd84315b49b69481e26d583f7d
        source:
            - on amd64: https://github.com/gleam-lang/gleam/releases/download/v1.19.1/gleam-v1.19.1-x86_64-unknown-linux-musl.tar.gz
            - on arm64: https://github.com/gleam-lang/gleam/releases/download/v1.19.1/gleam-v1.19.1-aarch64-unknown-linux-musl.tar.gz
        override-build: |
            version=$($SNAPCRAFT_PART_SRC/gleam -V | awk '/gleam/{print $2}')

            craftctl set version=$version
            craftctl default

            mkdir -p $SNAPCRAFT_PART_INSTALL/bin
            mv $SNAPCRAFT_PART_BUILD/gleam $SNAPCRAFT_PART_INSTALL/bin/gleam
