name: gleam
adopt-info: gleam
summary: Gleam Programming Language
description: |
    Gleam is a friendly language for building type-safe systems that
    scale! For more information see [the website](https://gleam.run)

title: Gleam
license: Apache-2.0
contact: rroesslerio@gmail.com
website: https://gleam.run
source-code:
    - https://github.com/gleam-lang/gleam
    - https://github.com/rroessler/gleam-snap
issues:
    - https://github.com/gleam-lang/gleam/issues
    - https://github.com/rroessler/gleam-snap/issues

base: core26
grade: stable
confinement: classic

platforms:
    amd64:
    arm64:

apps:
    gleam:
        command: bin/gleam
        environment:
            LANG: C.UTF-8
            LANGUAGE: C.UTF-8
            LC_ALL: C.UTF-8

parts:
    gleam:
        plugin: nil
        source-type: tar
        source-checksum:
            - on amd64: sha256/2ba2afb66ca9f6dcc01a4a6e9169b6942963bad6483bec9571ddc078cfe6f41f
            - on arm64: sha256/d1d1a9d53f6b317c0563a4806873c8ccace54291ead023373728af379402d4f1
        source:
            - on amd64: https://github.com/gleam-lang/gleam/releases/download/v1.19.2/gleam-v1.19.2-x86_64-unknown-linux-musl.tar.gz
            - on arm64: https://github.com/gleam-lang/gleam/releases/download/v1.19.2/gleam-v1.19.2-aarch64-unknown-linux-musl.tar.gz
        override-build: |
            version=$($SNAPCRAFT_PART_SRC/gleam -V | awk '/gleam/{print $2}')

            craftctl set version=$version
            craftctl default

            mkdir -p $SNAPCRAFT_PART_INSTALL/bin
            mv $SNAPCRAFT_PART_BUILD/gleam $SNAPCRAFT_PART_INSTALL/bin/gleam
